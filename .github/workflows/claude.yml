name: Claude

# Issue / PR / レビューコメントに「@claude ○○して」と書くと起動する
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# 既定は最小権限。ここで与えた範囲外のことは Claude にもできない
permissions:
  contents: write        # ブランチ作成・コミットに必要
  pull-requests: write   # PR 作成・コメントに必要
  issues: write          # Issue への返信に必要
  id-token: write
  actions: read          # CI のログを読ませる場合に必要

jobs:
  claude:
    # @claude を含むコメントのときだけ動かす（無駄な課金を防ぐ）
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 暴走時の保険。必ず入れる
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@19dda84776b3518d98b8798e591daee763049ed3 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          # 認証情報を持つジョブでは、PR側で変更できるスクリプトや汎用Gitを実行させない
          # テストはread-only・Secretsなしのtest.ymlに分離する
          claude_args: |
            --max-turns 25
