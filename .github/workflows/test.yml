name: Test

on:
  push:
    branches: [main]
  pull_request:

# PR側で変更可能なnpm scriptは、Secretsなし・read-only tokenでのみ実行する
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: npm test
